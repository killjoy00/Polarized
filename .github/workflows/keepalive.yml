# Free Supabase projects sleep after ~7 days without activity. A sleeping
# project means the first person to open the game after a quiet fortnight
# gets a room that won't create — a failure the app has no handling for.
#
# This pings the REST endpoint daily, which counts as activity. It also
# doubles as a monitor: a non-200 fails the job and GitHub emails you.
#
# The key below is the publishable key, the same one already in
# polarized/index.html and safe in public. Not a secret, so not a secret.

name: Keep Supabase awake

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST endpoint
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://hqvqxwlgjjxufbjklfhj.supabase.co/rest/v1/pol_rooms?select=code&limit=1" \
            -H "apikey: sb_publishable_NCRLW3byhByVaQpfobY0Zg_WaReRFRc")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase returned $code — the project may be paused or the key rotated."
            exit 1
          fi
