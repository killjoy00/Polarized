<script>
/* ─────────────────────────────  data  ───────────────────────────── */

const CATEGORIES = [
  "Breakfast","Airports","Pets","Small talk","Camping","Weddings","Group chats",
  "Leftovers","Karaoke","Road trips","Tattoos","Sequels","Hotel rooms","Coffee",
  "Gyms","Sandwiches","Halloween","Board games","Voicemail","Beaches","Tipping",
  "Houseplants","Snow","Barbecue","Public transit","Reality TV","Hot sauce",
  "Mornings","Cats","Dress codes","Casinos","Museums","Cruise ships","Cereal",
  "Fireworks","Alarm clocks","Buffets","Podcasts","Dogs at work","Airline seats",
  "Ice cream","Home repair","Mall food courts","Pickup trucks","Thrift stores",
  "Sports radio","Birthdays","Swimming pools","Cold weather","Texas","Airbnbs",
  "Amusement parks","Grocery stores","Haircuts","Long flights","Diners","Suburbs",
  "Costumes","Family photos","Parades","Winter sports","Fast food","Libraries"
];

/* ────────────────────────────  plumbing  ────────────────────────── */

const CONFIGURED = /^https:\/\/.+\.supabase\.co\/?$/.test(SB_URL || "")
                   && !SB_URL.includes("YOUR-PROJECT")
                   && /^(sb_publishable_|eyJ)/.test(SB_KEY || "");

/* The session is persisted on purpose. Identity is an anonymous Supabase user
   now, and the write policies compare auth.uid() to values inside the room —
   so losing the session on reload would lose your seat as well.             */
const sb = CONFIGURED ? supabase.createClient(SB_URL, SB_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
}) : null;

function store(k, v){
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem(k));
    localStorage.setItem(k, JSON.stringify(v));
  } catch { return null; }
}

/* your own vote, per room and round — the server stops handing choices back
   to browsers before the reveal, so this is what survives a reload */
const voteKey = (code, n) => `pol:v:${code}:${n}`;

const S = {
  screen: CONFIGURED ? "home" : "setup",
  me: null, name: "", code: "", isHost: false,
  room: null, myVote: null, note: "", busy: false,
  modCounts: false, joinCode: "", laps: 2, topicDraft: "", pick: null
};

(function identity(){
  const saved = store("pol:id");
  S.me   = (saved && saved.id) || "p" + Math.random().toString(36).slice(2,10);
  S.name = (saved && saved.name) || "";
  store("pol:id", Object.assign({}, saved, {id:S.me, name:S.name}));
})();

/* A shared room link — /?r=ABCD — only prefills the code. It deliberately does
   not auto-join: you still need a name, and joining is still a deliberate tap.
   Four letters, same alphabet newCode() draws from. */
(function fromLink(){
  const m = /[?&]r=([A-Za-z]{4})(?:&|$)/.exec(location.search);
  if (m) S.joinCode = m[1].toUpperCase();
})();

/* Anonymous sign-in. The room-write policies compare auth.uid() to
   round->>'modId', so the browser needs a real user rather than a string it
   made up — see supabase/rls-3-anon-auth.sql.

   Those policies are applied now, which means a browser without a session
   cannot write anything: it would join a room, appear to sit down, and save
   nothing. So this gates the home screen rather than carrying on with the
   local id. Three states, because "haven't tried yet" and "tried and failed"
   are not the same screen.

   A returning player whose user was pruned by pol_purge_anon_users() lands
   here too, and it costs them nothing: the stored refresh token is dead, so
   getSession() comes back empty and they sign in again as somebody new. */
let authState = "pending";      // → "ok" | "failed"

async function signIn(){
  if (!sb) return;
  for (let tries = 0; tries < 2; tries++){
    try {
      let session = null;
      try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
      if (!session){
        const {data, error} = await sb.auth.signInAnonymously();
        if (error) throw error;
        session = data && data.session;
      }
      // deliberately not written back to pol:id — saveSeat() records the id the
      // seat was actually taken with, which is how resume() spots a stale one
      const id = session && session.user && session.user.id;
      if (id){ S.me = id; authState = "ok"; return; }
    } catch (e){
      console.warn("[auth] anonymous sign-in failed", e && e.message);
    }
  }
  authState = "failed";
}

async function retryAuth(){
  authState = "pending"; S.note = ""; render(true);
  await signIn();
  render(true);
  if (authState === "ok") await resume();
}

const newCode = () => { const L="ABCDEFGHJKLMNPQRSTUVWXYZ";
  return [...Array(4)].map(()=>L[Math.random()*L.length|0]).join(""); };

function seeded(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return ()=>{h+=0x6d2b79f5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);
              return((t^t>>>14)>>>0)/4294967296;}; }
function categories(seed,n=6){ const r=seeded(seed), pool=[...CATEGORIES], out=[];
  while(out.length<n && pool.length) out.push(pool.splice(r()*pool.length|0,1)[0]);
  return out; }

/* The six categories are room state, not a local suggestion — everyone sees
   the same board, and the one the moderator locks in is swapped out for a
   fresh one before the gavel passes. The other five carry over. */
const catsOf = round => (round.cats && round.cats.length) ? round.cats : categories(S.code);
function freshCategory(cats, used){
  const taken = new Set([...cats, ...used]);
  const pool = CATEGORIES.filter(c => !taken.has(c));
  const src  = pool.length ? pool : CATEGORIES.filter(c => !cats.includes(c));
  return src[Math.random() * src.length | 0];
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ──────────────────  realtime: three tables, one channel  ───────────────── */
/* Each player writes only their own player row and their own vote row, so
   two people joining at the same moment can never overwrite each other.
   Only the moderator writes rooms.round.                                    */

let channel = null, poll = null, refreshSeq = 0;

function startPolling(){
  if (poll) return;
  poll = setInterval(() => { if (!document.hidden) refresh(); }, 2000);
}
function stopPolling(){ if (poll){ clearInterval(poll); poll = null; } }

async function refresh(){
  if (!S.code) return;
  const seq = ++refreshSeq;
  const [rooms, players, votes] = await Promise.all([
    sb.from("pol_rooms").select("round").eq("code", S.code).maybeSingle(),
    sb.from("pol_players").select("pid,name,joined").eq("code", S.code),
    // no `choice` — the database won't hand it out before the reveal, and the
    // only thing the client needs meanwhile is who has voted
    sb.from("pol_votes").select("n,pid").eq("code", S.code)
  ]);

  // Realtime fires this per vote row and the 2s poll fires it independently, so
  // several can be in flight at once. Without this, a slow reply landing after a
  // newer one drags the screen back to the round we already left.
  if (seq !== refreshSeq) return;

  const P = {};
  (players.data || []).forEach(p => P[p.pid] = {name:p.name, joined:p.joined});
  const V = {};
  (votes.data || []).forEach(v => { (V[v.n] = V[v.n] || {})[v.pid] = true; });

  const prev = S.room && S.room.round;
  const next = (rooms.data && rooms.data.round) || null;
  if (prev && next && prev.n !== next.n){ S.myVote = null; S.pick = null; }

  S.room = {players:P, round:next, votes:V};

  // a reconnecting player gets their vote back instead of appearing to have not
  // voted — from local storage now, since the server won't tell anyone, us
  // included, what anyone picked before the reveal
  if (next && S.myVote == null){
    const mine = store(voteKey(S.code, next.n));
    if (mine) S.myVote = mine;
  }

  if (S.screen !== "game" && next) S.screen = "game";
  render();
}

function subscribe(code){
  unsubscribe();
  const f = `code=eq.${code}`;
  channel = sb.channel(`room-${code}`)
    .on("postgres_changes", {event:"*", schema:"public", table:"pol_rooms",   filter:f}, refresh)
    .on("postgres_changes", {event:"*", schema:"public", table:"pol_players", filter:f}, refresh)
    .on("postgres_changes", {event:"*", schema:"public", table:"pol_votes",   filter:f}, refresh)
    .subscribe(st => console.log("[realtime]", st));
  startPolling();   // backstop — correctness never depends on the socket
}
function unsubscribe(){
  stopPolling();
  if (channel){ sb.removeChannel(channel); channel = null; }
}

/* remember the room so a refresh or a dead battery isn't fatal */
function saveSeat(){
  store("pol:id", {id:S.me, name:S.name.trim(), room:S.code, host:S.isHost});
}
async function resume(){
  const saved = store("pol:id");
  if (!CONFIGURED || !saved || !saved.room) return false;
  // the seat belongs to whoever took it. Signing in anonymously changed this
  // browser's id once, and a seat from before that switch is not ours to claim
  // — rejoining fresh beats sitting down twice under two names.
  if (saved.id !== S.me){ store("pol:id", {id:S.me, name:S.name}); return false; }
  const {data} = await sb.from("pol_rooms").select("code").eq("code", saved.room).maybeSingle();
  if (!data){ store("pol:id", {id:S.me, name:S.name}); return false; }

  S.code = saved.room;
  S.isHost = !!saved.host;
  S.screen = "lobby";
  // ignoreDuplicates keeps the original joined time, so turn order never reshuffles
  await sb.from("pol_players").upsert(
    {code:S.code, pid:S.me, name:(S.name || "Player").slice(0,14), joined:Date.now()},
    {onConflict:"code,pid", ignoreDuplicates:true}
  );
  subscribe(S.code);
  await refresh();
  return true;
}

/* ────────────────────────────  scoring  ─────────────────────────── */

const WOLF_MIN_SEATS = 5;   // mirrored in pol_reveal()

function score(round, votes){
  votes = votes || {};
  const order = round.order || [];
  const live = order.filter(id => votes[id] && (round.modCounts || id !== round.modId));
  const agree    = live.filter(id => votes[id] === "a");
  const disagree = live.filter(id => votes[id] === "d");
  const pairs = Math.min(agree.length, disagree.length);
  let wolf = null;
  // Seats at the table, not votes cast. Below five the room is small enough
  // that standing alone is a coin flip rather than a stand, and the bonus
  // starts outweighing the pairs it costs the moderator.
  if (order.length >= WOLF_MIN_SEATS){
    if (agree.length === 1 && disagree.length >= 2) wolf = agree[0];
    if (disagree.length === 1 && agree.length >= 2) wolf = disagree[0];
    if (wolf === round.modId) wolf = null;        // moderator never takes it
  }
  return {agree, disagree, pairs, wolf};
}

/* ────────────────────────────  actions  ─────────────────────────── */

async function joinRoom(code, host){
  if (!S.name.trim()){ S.note = "Enter your name first."; return render(); }
  S.busy = true; render();

  if (host){
    const {error} = await sb.from("pol_rooms").insert({code, round:null});
    if (error){ S.busy = false; S.note = "Couldn't open a room. Try again."; return render(); }
  } else {
    const {data} = await sb.from("pol_rooms").select("code").eq("code", code).maybeSingle();
    if (!data){ S.busy = false; S.note = `No room called ${code}. Check the letters.`; return render(); }
  }

  S.isHost = host; S.code = code; S.note = "";
  await sb.from("pol_players").upsert({
    code, pid:S.me, name:S.name.trim().slice(0,14), joined:Date.now()
  });

  saveSeat();
  subscribe(code);
  S.busy = false; S.screen = "lobby";
  await refresh();
}

async function startGame(){
  const players = (S.room && S.room.players) || {};
  const order = Object.keys(players).sort((a,b) => players[a].joined - players[b].joined);
  const names = {}; order.forEach(id => names[id] = players[id].name);
  await sb.from("pol_rooms").update({
    round: {n:1, modId:order[0], phase:"topic", order, names, scores:{},
            modCounts:S.modCounts, laps:S.laps,
            cats:categories(S.code), used:[]}
  }).eq("code", S.code);
}

/* The moderator locks a category before writing, so the room knows what it's
   about to argue over. One round-state write, by the moderator, as always. */
async function lockCategory(cat){
  if (!cat) return;
  S.busy = true; render();
  await sb.from("pol_rooms")
    .update({round: Object.assign({}, S.room.round, {category:cat})})
    .eq("code", S.code);
  S.pick = null; S.busy = false;
  await refresh();
}

async function submitTopic(){
  const text = S.topicDraft.trim();
  if (!text) return;
  S.busy = true; render(true);
  await sb.from("pol_rooms")
    .update({round: Object.assign({}, S.room.round, {phase:"voting", topic:text})})
    .eq("code", S.code);
  S.topicDraft = ""; S.busy = false;
}

/* Insert first, update if the row is already there. Not an upsert: Postgres
   wants a table-wide SELECT for INSERT ... ON CONFLICT, and browsers no
   longer have one — they can read who voted, never what. Changing your mind
   costs a second round trip, which nobody can feel.                        */
async function vote(choice){
  const n = S.room.round.n;
  const was = S.myVote;
  S.myVote = choice;
  store(voteKey(S.code, n), choice);   // the only copy we can read back
  render();
  let {error} = await sb.from("pol_votes").insert({code:S.code, n, pid:S.me, choice});
  if (error) ({error} = await sb.from("pol_votes").update({choice})
                                .match({code:S.code, n, pid:S.me}));

  // If both writes failed there is no row, and "Locked in" would be a lie the
  // player cannot catch: nobody can read `choice` back to check. Put the screen
  // back where it was and say so.
  if (error){
    S.myVote = was;
    store(voteKey(S.code, n), was);
    S.note = "That vote didn't save. Tap again.";
    render();
  } else if (S.note){
    S.note = ""; render();
  }
}

/* Scoring lives in the database — see supabase/rls-1-reveal-function.sql.
   Doing it here would mean every client could read every vote while the
   round was still open, which is how you cheat at this game.              */
async function reveal(){
  S.busy = true; render();
  const {error} = await sb.rpc("pol_reveal", {p_code: S.code});
  S.busy = false;
  if (error){ S.note = "Couldn't reveal. Try again."; return render(); }
  await refresh();
}

async function nextRound(){
  const round = S.room.round;
  const i = round.order.indexOf(round.modId);
  // the game was always going to end on this round, so a newcomer arriving now
  // does not get to extend it
  const finishing = round.n >= round.order.length * (round.laps || 1);
  S.myVote = null; S.pick = null; S.topicDraft = "";

  // Seat anyone who joined after the game started. They take the last chairs,
  // in the order they arrived, and moderate in turn like everyone else — which
  // makes the game longer, since its length is seats × laps. Only the moderator
  // writes round, so this reconciliation happens here and nowhere else.
  const seated  = new Set(round.order);
  const players = (S.room && S.room.players) || {};
  const late = finishing ? [] : Object.keys(players)
    .filter(id => !seated.has(id))
    .sort((a, b) => players[a].joined - players[b].joined);
  const order = late.length ? round.order.concat(late) : round.order;
  const names = Object.assign({}, round.names);
  late.forEach(id => names[id] = players[id].name);

  const done = round.n >= order.length * (round.laps || 1);

  // spend the category: the five that weren't picked carry over, the one that
  // was is replaced with something the room hasn't seen
  const cats = catsOf(round).slice();
  const used = (round.used || []).slice();
  const spent = cats.indexOf(round.category);
  if (spent >= 0){
    used.push(round.category);
    cats[spent] = freshCategory(cats, used);
  }

  const next = Object.assign({}, round, {
    n: round.n + 1,
    modId: order[(i + 1) % order.length],
    phase: done ? "final" : "topic",
    order, names, cats, used
  });
  delete next.revealed;
  delete next.topic;
  delete next.category;
  await sb.from("pol_rooms").update({round: next}).eq("code", S.code);
}

/* Reading four letters across a table is the first thing that goes wrong at a
   party. The link carries the code; the native share sheet if there is one,
   the clipboard if not, and the bare URL to read out if neither works. */
const roomLink = () =>
  location.origin + location.pathname.replace(/index\.html$/, "") + "?r=" + S.code;

let noteTimer = null;
function flash(msg){
  S.note = msg; render();
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { if (S.note === msg){ S.note = ""; render(); } }, 2500);
}

async function shareRoom(){
  const url = roomLink();
  try {
    if (navigator.share){
      await navigator.share({title:"Polarized", text:`Join my room — ${S.code}`, url});
      return;
    }
  } catch (e){ if (e && e.name === "AbortError") return; }   // they closed the sheet
  try { await navigator.clipboard.writeText(url); flash("Link copied."); }
  catch (e){ flash(url); }
}

function leave(){
  unsubscribe(); stopDictation();
  clearTimeout(noteTimer);
  store("pol:id", {id:S.me, name:S.name});
  Object.assign(S, {screen:"home", code:"", room:null, myVote:null, isHost:false, note:""});
  render();
}

/* ───────────────────────────  dictation  ────────────────────────── */
/* Web Speech API, feature-detected. Chrome, Edge and Safari (including iOS)
   have it; Firefox does not, and there the button simply isn't drawn. The
   recogniser writes straight into the textarea rather than through render(),
   for the same reason typing does: a repaint mid-sentence moves the cursor. */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, dictating = false, dictBase = "";

function typeInto(text){
  S.topicDraft = text;
  const ta = document.getElementById("topic");
  if (ta && ta.value !== text) ta.value = text;
  const send = document.getElementById("send");
  if (send) send.disabled = !text.trim();
}

function dictate(){
  if (!SR) return;
  if (dictating){ try { recog.stop(); } catch (e) {} return; }

  recog = new SR();
  recog.lang = navigator.language || "en-US";
  recog.continuous = true;
  recog.interimResults = true;
  dictBase = S.topicDraft;

  recog.onresult = e => {
    let final = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    const tidy = s => s.replace(/\s+/g, " ").trim().slice(0, 180);
    if (final) dictBase = tidy(dictBase + " " + final);
    typeInto(tidy(dictBase + " " + interim));
  };
  recog.onerror = e => {
    S.note = e.error === "not-allowed" || e.error === "service-not-allowed"
      ? "Microphone blocked. Allow it in your browser's site settings."
      : e.error === "no-speech" ? "" : "Dictation stopped. Type it instead.";
  };
  recog.onend = () => { dictating = false; render(true); };

  try { recog.start(); dictating = true; S.note = ""; render(true); }
  catch (e) { dictating = false; }
}
function stopDictation(){ if (dictating){ try { recog.stop(); } catch (e) {} } }

/* ──────────────────────────────  ads  ───────────────────────────── */

const AD_VERIFY = /^ca-pub-\d+$/.test(AD_CLIENT);
const AD_ON     = AD_VERIFY && /^\d+$/.test(AD_SLOT);
let adReady = false;

function initAds(){
  if (!AD_VERIFY) return;
  const ins = document.querySelector("#ad ins");
  ins.setAttribute("data-ad-client", AD_CLIENT);
  if (AD_SLOT) ins.setAttribute("data-ad-slot", AD_SLOT);
  const tag = document.createElement("script");
  tag.async = true; tag.crossOrigin = "anonymous";
  tag.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + AD_CLIENT;
  document.head.appendChild(tag);
}
function showAd(on){
  if (!AD_ON) return;
  document.getElementById("ad").style.display = on ? "block" : "none";
  if (on && !adReady){
    adReady = true;
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
  }
}

/* ─────────────────────────────  views  ──────────────────────────── */

const app = document.getElementById("app");

let lastSig = "";
function render(force){
  // the 2s poll would otherwise wipe the textarea mid-sentence
  const sig = JSON.stringify([S.screen, S.code, S.myVote, S.pick, dictating,
                              S.note, S.busy, S.modCounts, S.laps, S.room, authState]);
  if (!force && sig === lastSig) return;
  lastSig = sig;

  const active = document.activeElement;
  const keepId = active && active.id;
  const keepAt = active && active.selectionStart;

  app.innerHTML = ({setup, home, lobby, game})[S.screen === "game" ? "game" : S.screen]();
  bind();

  if (keepId){
    const el = document.getElementById(keepId);
    if (el){ el.focus(); try { el.setSelectionRange(keepAt, keepAt); } catch (e) {} }
  }
  const rd = S.room && S.room.round;
  showAd(S.screen === "lobby" || !!(rd && rd.phase === "final"));
}

const setup = () => `
  <div class="tag mt24">A party game</div>
  <h1 class="logo">POLARIZED</h1>
  <div class="rule mb32"><i></i><i></i></div>
  <div class="eyebrow">One step left</div>
  <div class="setup">
    This page needs your Supabase project URL and anon key to pass votes between phones.
    <ol>
      <li>Supabase dashboard → your project → <b>Project Settings → Data API</b></li>
      <li>Copy the <b>Project URL</b> into <code>SB_URL</code></li>
      <li>Copy the <b>anon public</b> key into <code>SB_KEY</code></li>
      <li>Run <code>supabase/setup.sql</code> in the SQL editor</li>
      <li>Reload</li>
    </ol>
    <div class="mt24">The anon key is meant to be public — it ships in every browser. Row-level
    security is what protects the data, not the key.</div>
  </div>`;

const home = () => `
  <div class="tag mt24">A party game</div>
  <h1 class="logo">POLARIZED</h1>
  <div class="rule mb32"><i></i><i></i></div>

  <div class="eyebrow">Your name</div>
  <input id="name" class="mb24" value="${esc(S.name)}" placeholder="Ryan" maxlength="14" autocomplete="off">

  <button class="btn mb32" id="host" ${authState === "ok" ? "" : "disabled"}>Start a room</button>

  <div class="eyebrow">Or join with a code</div>
  <div style="display:flex;gap:8px">
    <input id="join" value="${esc(S.joinCode)}" placeholder="ABCD" maxlength="4" autocomplete="off"
           style="text-align:center;font:600 24px ui-monospace,Menlo,monospace;letter-spacing:.2em">
    <button class="btn" id="dojoin" style="width:auto;padding:0 26px"
            ${authState === "ok" ? "" : "disabled"}>Join</button>
  </div>
  ${authState === "failed" ? `<div class="err">Couldn't reach the game server. Nothing you do here would save.
    <button class="link" id="retryauth" style="padding:0 0 0 4px">Try again</button></div>` : ""}
  ${S.note ? `<div class="err">${esc(S.note)}</div>` : ""}
  <div class="grow"></div>
  <div class="mono mt32" style="line-height:1.8">
    Say something the room will split on<br>
    Score a point for every pair you divide<br>
    Stand alone against a room of five or more and take one for yourself
  </div>
  <a href="/privacy" class="mono" style="padding-top:20px;text-decoration:underline">Privacy</a>`;

function lobby(){
  const players = (S.room && S.room.players) || {};
  const ids = Object.keys(players).sort((a,b) => players[a].joined - players[b].joined);
  if (S.room && S.room.round){ S.screen = "game"; return game(); }
  return `
  <div class="eyebrow">Room code — say it out loud</div>
  <div class="code mb16">${esc(S.code)}</div>
  <button class="btn ghost mb8" id="share">Share the link</button>
  ${S.note ? `<div class="err mb16">${esc(S.note)}</div>` : `<div class="mb24"></div>`}

  <div class="eyebrow">In the room · ${ids.length}</div>
  <div class="mb24">
    ${ids.map((id,i) => `<div class="row"><span style="font-size:17px">${esc(players[id].name)}</span>
      <span class="mono">${i === 0 ? "moderates first" : "#" + (i+1)}</span></div>`).join("")}
    ${ids.length < 3 ? `<div class="setup mt24">Waiting on players. Three minimum — you need two voters to make a pair.</div>` : ""}
  </div>

  ${S.isHost ? `
    <div class="eyebrow" style="margin-top:8px">Turns as moderator, each</div>
    <div class="laps">
      ${[1,2,3].map(v => `<button data-laps="${v}" class="${S.laps === v ? "on" : ""}">${v}${v === 1 ? " lap" : " laps"}</button>`).join("")}
    </div>
    <div class="setup mb24" style="font-size:13px">${ids.length ? ids.length * S.laps : "—"} rounds total</div>

    <button id="toggle" class="row" style="width:100%;text-align:left;border-top:1px solid var(--ink2)">
      <span style="color:var(--mute);font-size:14px">Moderator's own vote counts toward pairs</span>
      <span class="mono" style="padding:6px 9px;background:${S.modCounts ? "var(--agree)" : "var(--ink2)"};color:${S.modCounts ? "var(--ink)" : "var(--mute)"}">${S.modCounts ? "on" : "off"}</span>
    </button>
    <button class="btn mt24" id="start" ${ids.length < 3 ? "disabled" : ""}>Start game</button>
  ` : `<div class="setup">Waiting for the host to start.</div>`}

  <div class="grow"></div>
  <button class="link mt32" id="leave">Leave room</button>`;
}

function game(){
  const round = S.room && S.room.round;
  if (!round) return `<div class="setup mt32">Syncing…</div>`;

  const iAmMod = round.modId === S.me;
  const modName = (round.names || {})[round.modId] || "…";
  const total  = (round.order || []).length;                 // seats at the table
  const rounds = total * (round.laps || 1);                  // rounds in the game
  const head = `<div class="row" style="border:none;padding:0 0 28px">
      <span class="mono">Round ${Math.min(round.n, rounds)} / ${rounds}</span>
      <span class="mono">${esc(S.code)}</span></div>`;

  const standings = (round.order || [])
    .map(id => ({id, name:(round.names||{})[id], pts:(round.scores||{})[id] || 0}))
    .sort((a,b) => b.pts - a.pts);

  // shown on the reveal and, so the wait has something to read, to everyone
  // sitting out the moderator's turn
  const board = (hi) => standings.map(s => `<div class="row">
      <span style="color:${s.id === hi ? "var(--paper)" : "var(--mute)"}">${esc(s.name)}</span>
      <span style="font-family:ui-monospace,Menlo,monospace">${s.pts}</span></div>`).join("");

  if (round.phase === "final"){
    const top = standings[0] || {name:"—", pts:0};
    return head + `
      <div class="eyebrow">Final</div>
      <div style="font:900 44px/1 Archivo;letter-spacing:-.03em">${esc(top.name)}</div>
      <div class="mb32" style="color:var(--agree);font-size:17px;padding-top:6px">${top.pts} points</div>
      ${standings.map((s,i) => `<div class="row"><span><span class="mono" style="margin-right:12px">${i+1}</span>${esc(s.name)}</span>
        <span style="font-family:ui-monospace,Menlo,monospace">${s.pts}</span></div>`).join("")}
      <div class="grow"></div>
      <button class="btn ghost mt32" id="leave">Back to start</button>`;
  }

  // Joined after the game started. nextRound() seats them; until then their
  // vote would be stored and never scored, so don't offer them one.
  if (!(round.order || []).includes(S.me)){
    return head + `
      <div class="eyebrow">You're in the room</div>
      <div style="font:900 32px/1 Archivo;letter-spacing:-.03em">${esc(S.name || "Player")}</div>
      <div class="setup" style="padding-top:10px">The game had already started. You take a
      seat when this round ends — then you vote and moderate like everyone else.</div>
      <div class="eyebrow mt32">Standings</div>
      <div>${board(round.modId)}</div>
      <div class="grow"></div>
      <div class="mono mt32">Waiting for the round to end</div>`;
  }

  if (round.phase === "topic"){
    const cats = catsOf(round);

    if (!iAmMod){
      return head + `
        <div class="eyebrow">Moderator</div>
        <div style="font:900 32px/1 Archivo;letter-spacing:-.03em">${esc(modName)}</div>
        <div class="setup" style="padding-top:10px">${round.category
          ? "is writing a statement…"
          : "is picking a category…"}</div>
        ${round.category ? `<div class="cat locked mt24">${esc(round.category)}</div>` : ""}
        <div class="eyebrow mt32">Standings</div>
        <div>${board(round.modId)}</div>
        <div class="grow"></div>
        <div class="mono mt32">Get ready to pick a side</div>`;
    }

    if (!round.category){
      return head + `
        <div class="eyebrow">You're the moderator</div>
        <div class="mb24" style="font:600 22px/1.35 Archivo">Pick a category. The room sees it too — then write something they'll split on.</div>
        <div class="grid2 mb16">${cats.map(c =>
          `<button class="cat ${S.pick === c ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
        <div class="setup" style="font-size:13px">Whichever you take is retired for the game. The other five stay for the next moderator.</div>
        <div class="grow"></div>
        <button class="btn mt32" id="lock" ${S.pick && !S.busy ? "" : "disabled"}>Lock it in</button>`;
    }

    return head + `
      <div class="eyebrow">Your category</div>
      <div class="cat locked mb24">${esc(round.category)}</div>
      <div class="mb16" style="font:600 22px/1.35 Archivo">Write something the room will split on. Score a point for every pair you divide.</div>
      <textarea id="topic" placeholder="Pineapple belongs on pizza." maxlength="180">${esc(S.topicDraft)}</textarea>
      ${SR ? `<button class="mic ${dictating ? "on" : ""}" id="mic">${
        dictating ? "Listening — tap to stop" : "Speak it instead"}</button>` : ""}
      ${S.note ? `<div class="err">${esc(S.note)}</div>` : ""}
      <div class="grow"></div>
      <button class="btn mt32" id="send" ${S.topicDraft.trim() ? "" : "disabled"}>Send to the room</button>`;
  }

  if (round.phase === "voting"){
    const votes = (S.room.votes && S.room.votes[round.n]) || {};
    // only seats count — an unseated newcomer's vote is stored but never scored,
    // and counting it here reads as "6 of 5 voted"
    const cast = Object.keys(votes).filter(id => (round.order || []).includes(id)).length;
    return head + `
      <div class="eyebrow">${iAmMod ? "Your statement" : esc(modName) + " says"}${
        round.category ? " · " + esc(round.category) : ""}</div>
      <div class="topic">${esc(round.topic || "")}</div>

      <div class="eyebrow">Your vote</div>
      <div class="grid2 mb16">
        <button class="vote a ${S.myVote === "a" ? "on" : ""} ${S.myVote === "d" ? "dim" : ""}" data-vote="a">Agree</button>
        <button class="vote d ${S.myVote === "d" ? "on" : ""} ${S.myVote === "a" ? "dim" : ""}" data-vote="d">Disagree</button>
      </div>
      ${S.myVote ? `<div class="setup">Locked in. You can change it until the reveal.</div>` : ""}
      ${S.note ? `<div class="err">${esc(S.note)}</div>` : ""}

      <div class="grow"></div>
      ${iAmMod ? `
        <div class="mono mb16">${cast} of ${total} voted</div>
        <button class="btn" id="reveal" ${cast < 2 ? "disabled" : ""}>Reveal votes</button>
      ` : `<div class="mono">${cast} of ${total} voted</div>`}`;
  }

  const votes = round.revealed || {};
  const r = score(round, votes);
  const n = r.agree.length + r.disagree.length;
  const aPct = n ? (r.agree.length / n) * 100 : 50;
  const pairs = Array.from({length:r.pairs}, (_, i) => [r.agree[i], r.disagree[i]]);
  const spare = [...r.agree.slice(r.pairs).map(id => [id,"a"]),
                 ...r.disagree.slice(r.pairs).map(id => [id,"d"])];

  return head + `
    <div class="eyebrow">${esc(modName)} said${round.category ? " · " + esc(round.category) : ""}</div>
    <div class="topic">${esc(round.topic || "")}</div>

    <div class="eyebrow">The room</div>
    <div class="bar"><i class="a" style="width:${aPct}%"></i><i class="d" style="width:${100-aPct}%"></i></div>
    <div class="row mono" style="border:none;padding:0 0 28px"><span>${r.agree.length} agree</span><span>${r.disagree.length} disagree</span></div>

    <div class="eyebrow">Pairs — ${esc(modName)} scores ${r.pairs}</div>
    <div class="mb24">
      ${pairs.map(([a,d],i) => `<div class="pair" style="animation-delay:${i*90}ms">
          <span class="side a">${esc((round.names||{})[a])}</span>
          <span class="mono">+1</span>
          <span class="side d">${esc((round.names||{})[d])}</span></div>`).join("")}
      ${r.pairs === 0 ? `<div class="setup" style="padding:14px 0">The room agreed with itself. No pairs, no points.</div>` : ""}
      ${spare.map(([id,side],i) => `<div class="pair" style="animation-delay:${(pairs.length+i)*90}ms">
          ${side === "a"
            ? `<span class="side a open">${esc((round.names||{})[id])}</span>`
            : `<span class="side"></span>`}
          <span class="mono ghost">+1</span>
          ${side === "d"
            ? `<span class="side d open">${esc((round.names||{})[id])}</span>`
            : `<span class="side"></span>`}</div>`).join("")}
    </div>

    ${r.wolf ? `<div class="wolf">
        <div class="eyebrow" style="color:var(--agree);margin-bottom:6px">Lone wolf +1</div>
        <div style="font:600 18px Archivo">${esc((round.names||{})[r.wolf])} was the only one.</div></div>` : ""}

    <div class="eyebrow">Standings</div>
    <div class="mb32">${board(round.modId)}</div>

    <div class="grow"></div>
    ${iAmMod
      ? `<button class="btn" id="next">${round.n >= rounds ? "See final scores" : "Next round"}</button>`
      : `<div class="setup">Waiting for ${esc(modName)} to pass the gavel. Argue in the meantime.</div>`}`;
}

/* ────────────────────────────  binding  ─────────────────────────── */

function bind(){
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  const nameEl = document.getElementById("name");
  if (nameEl) nameEl.oninput = e => { S.name = e.target.value; };
  const joinEl = document.getElementById("join");
  if (joinEl) joinEl.oninput = e => {
    S.joinCode = e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g,"");
  };

  const topicEl = document.getElementById("topic");
  if (topicEl) topicEl.oninput = e => {
    S.topicDraft = e.target.value;                    // no re-render: keeps the cursor put
    dictBase = e.target.value;                        // typing wins over what was dictated
    const send = document.getElementById("send");
    if (send) send.disabled = !S.topicDraft.trim();
  };
  document.querySelectorAll("[data-laps]").forEach(b =>
    b.onclick = () => { S.laps = +b.dataset.laps; render(true); });
  document.querySelectorAll("[data-cat]").forEach(b =>
    b.onclick = () => { S.pick = b.dataset.cat; render(); });

  on("retryauth", retryAuth);
  on("share",  shareRoom);
  on("mic",    dictate);
  on("lock",   () => lockCategory(S.pick));
  on("send",   submitTopic);
  on("host",   () => joinRoom(newCode(), true));
  on("dojoin", () => S.joinCode.length === 4 && joinRoom(S.joinCode, false));
  on("toggle", () => { S.modCounts = !S.modCounts; render(); });
  on("start",  startGame);
  on("reveal", reveal);
  on("next",   nextRound);
  on("leave",  leave);

  document.querySelectorAll("[data-vote]").forEach(b => b.onclick = () => vote(b.dataset.vote));
}

initAds();
render();
(async () => {
  await signIn();     // settles who this browser is before anything is written
  render(true);
  // no session, no writes — resuming would only put them in a room they
  // cannot save a vote to
  if (authState === "ok") await resume();
})();
</script>
